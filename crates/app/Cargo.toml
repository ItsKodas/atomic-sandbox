[package]
name = "app"
edition.workspace = true
version.workspace = true

[dependencies]
gpu = { path = "../gpu" }
render = { path = "../render" }
qm = { path = "../qm" }
qm-gpu = { path = "../qm-gpu" }
sim = { path = "../sim" }
providers = { path = "../providers" }
surrogate = { path = "../surrogate" }
units = { path = "../units" }
wgpu = { workspace = true }
# the pop-out view's surface configure is checked in an error scope (plumbing)
pollster = { workspace = true }
winit = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
# the workspace's dock tree: splits and tabbed leaves (docking spec; nothing floats, D-5)
egui_dock = { workspace = true }
glam = { workspace = true }
png = { workspace = true }
# native open/save dialogs for model files (plumbing; user request 2026-10-18)
rfd = "0.15"
# the updater's GitHub releases answer and release manifest, as JSON (plumbing; installer spec)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# release tags as versions: ordering, pre-releases (plumbing; installer spec)
semver = "1"
# SHA-256 of a downloaded release asset, checked against SHA256SUMS.txt (plumbing; installer spec)
sha2 = "0.10"
# the minisign signature over SHA256SUMS.txt, verified with the compiled-in key (plumbing; installer spec)
minisign-verify = "0.2"
# the updater's HTTPS GETs (GitHub's releases list and its asset downloads) over rustls with the
# bundled Mozilla roots, no native-tls (plumbing; installer spec). 2.x: its per-read timeout keeps a
# slow download going while a stalled one fails (3.x times the whole body)
ureq = { version = "2.12", default-features = false, features = ["tls"] }

# test only: signs the updater's fixtures with the committed TEST-ONLY key (an ignored helper, `update::verify`)
[dev-dependencies]
minisign = "0.7"

# embeds the app icon (`build.rs`, drawn by `src/icon.rs`) in app.exe on Windows
[build-dependencies]
winresource = "0.1"

# the custom window frame's hit test (`frame.rs`; user request 2026-10-18, option B)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
