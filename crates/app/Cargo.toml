[package]
name = "app"
edition.workspace = true
version.workspace = true

[dependencies]
gpu = { path = "../gpu" }
render = { path = "../render" }
qm = { path = "../qm" }
qm-gpu = { path = "../qm-gpu" }
sim = { path = "../sim" }
providers = { path = "../providers" }
surrogate = { path = "../surrogate" }
units = { path = "../units" }
wgpu = { workspace = true }
winit = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
glam = { workspace = true }
png = { workspace = true }
# native open/save dialogs for model files (plumbing; user request 2026-10-18)
rfd = "0.15"

# embeds the app icon (`build.rs`, drawn by `src/icon.rs`) in app.exe on Windows
[build-dependencies]
winresource = "0.1"

# the custom window frame's hit test (`frame.rs`; user request 2026-10-18, option B)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
