[workspace]
resolver = "2"
members = ["crates/units", "crates/qm", "crates/validate", "crates/gpu", "crates/qm-gpu", "crates/render", "crates/app"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/ItsKodas/atomic-sandbox"

[workspace.dependencies]
nalgebra = "0.33"
approx = "0.5"
rand = "0.8"
thiserror = "1"
libm = "0.2"
wgpu = "30"
winit = "0.30"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
png = "0.18"

[profile.release]
debug = 1
